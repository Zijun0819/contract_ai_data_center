[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-contract-optimizer"
version = "0.5.0"
description = "Contract menus and divisible-workload scheduling for an energy-aware LLM data center"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "PyYAML>=6,<7",
  "scipy>=1.11,<2",
]

[project.scripts]
llm-contract-opt = "llm_contract_optimizer.cli:main"

[project.optional-dependencies]
data = ["pandas>=1.5,<3"]

[tool.setuptools.packages.find]
where = ["src"]

